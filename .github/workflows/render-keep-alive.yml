name: Render Keep-Alive

on:
  schedule:
    # Cada 10 minutos (el free tier de Render duerme el contenedor tras ~15 min sin trafico)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite ejecutar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 90 \
            "https://conectar-sj-backend.onrender.com/health")
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check fallo (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Render ping completed at $(date -u)"
