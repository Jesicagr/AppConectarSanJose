
spring.jpa.properties.hibernate.format_sql=true

# Configuracion del servidor de correo electronico (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL de conexion al Transaction Pooler de Supabase
spring.datasource.url=${SUPABASE_DB_URL}

# Tu usuario unico de proyecto
spring.datasource.username=${SUPABASE_DB_USERNAME}

# Tu contrasena de Supabase
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# Driver oficial de PostgreSQL y configuracion de Hibernate
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
